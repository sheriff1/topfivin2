# Dependabot: monthly, staggered across the 1st/8th/15th, grouped minor/patch updates per ecosystem. Major bumps are never
# grouped, so each arrives as its own PR for manual review; reviewers come from .github/CODEOWNERS. Minor/patch PRs are auto-merged by dependabot-automerge.yml (#238).
# Staggered so merges never land in one burst: each merge to main is a Vercel production build
# counted against the team's 100/24h limit (docs/deploy-budget.md).
version: 2
updates:
  # Root pnpm workspace (backend + frontend); Dependabot reads pnpm-lock.yaml
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 6 1 * *"
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
    ignore:
      # ESLint is held at 9 in both packages until plugins support 10 (#235)
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 6 8 * *"
    groups:
      actions-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: "/"
    schedule:
      interval: cron
      cronjob: "0 6 15 * *"
    groups:
      pip-minor-patch:
        update-types: [minor, patch]
    ignore:
      # nba_api is now a PyPI pin (was a git commit, #195); upgrades are reviewed by hand
      - dependency-name: nba_api
