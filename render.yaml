# Render Blueprint for the topfivin2 API (Express + Postgres on Neon).
# Create it from the dashboard: New > Blueprint > pick this repo. Render prompts for the
# `sync: false` values below; they are never stored in git.
services:
  - type: web
    name: topfivin2-api
    runtime: node
    region: ohio
    plan: free
    branch: main
    autoDeployTrigger: commit
    # Repo root (not `backend`) so pnpm can see the workspace lockfile. pnpm is pinned to match CI.
    buildCommand: corepack enable && corepack prepare pnpm@10.30.3 --activate && pnpm install --frozen-lockfile --filter backend...
    startCommand: cd backend && node src/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      # Neon connection string (pooled or direct). Set in the dashboard.
      - key: DATABASE_URL
        sync: false
      # Vercel production URL(s), used for CORS. Set in the dashboard.
      - key: FRONTEND_URL
        sync: false
      - key: FRONTEND_URL_2
        sync: false
      # Proxy hops to trust for req.ip. Render sits behind Cloudflare plus an internal proxy:
      # X-Forwarded-For is "client, cloudflare, render-internal" and the socket is one more
      # hop, so 3 is needed for req.ip to be the real client (1 gives the internal address
      # and puts every visitor in one rate-limit bucket). Verified in #203.
      - key: TRUST_PROXY
        value: 3
      # Diagnostic used to verify TRUST_PROXY (#203). Set to true to log req.ip and
      # X-Forwarded-For on each request when re-checking after a Render networking change.
      - key: LOG_CLIENT_IP
        value: false
      # PORT is injected by Render. Logs go to stdout (no LOG_TO_FILES), since the disk is ephemeral.
      # No season variable: the API derives the current season from stored data.
